# =============================================================================
# REFERENCE WORKFLOW: Build & publish a Docker image to Docker Hub + GHCR
# =============================================================================
# Trigger a GitHub Release (draft, pre-release, or full release) and this
# workflow builds your Dockerfile and pushes the resulting image to both:
#   - Docker Hub   (docker.io)
#   - GitHub Container Registry (ghcr.io)
#
# Reuse checklist for a new project:
#   1. Update DOCKERHUB_IMAGE_NAME below.
#   2. Make sure DOCKER_USERNAME / DOCKER_PASSWORD secrets exist in the repo
#      (Settings -> Secrets and variables -> Actions).
#   3. Make sure this file is merged into the DEFAULT branch (e.g. main)
#      *before* you create a release — GitHub only listens for events using
#      the workflow version that exists on the default branch at trigger time.
# =============================================================================

name: Publish the package to github registry and dockerhub

# -----------------------------------------------------------------------------
# TRIGGER
# -----------------------------------------------------------------------------
# "release" event types you can choose from:
#   created      -> fires as soon as a release object is created, even drafts
#   published    -> fires for any non-draft release (normal or pre-release)
#   prereleased  -> fires only when a release is marked as a pre-release
#   released     -> fires only for a full (non-prerelease) release
#   unpublished, edited, deleted -> fire on those respective actions
#
# Using [published, prereleased] here is slightly redundant since "published"
# already covers pre-releases too — but listing both makes the intent
# explicit and doesn't hurt.
#
# Alternatives for other projects:
#   on: push:  tags: ["v*"]        # trigger on git tag push instead of releases
#   on: workflow_dispatch:         # allow manual trigger from the Actions tab
on:
  release:
    types: [published, prereleased]

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES (shared across all jobs/steps below)
# -----------------------------------------------------------------------------
env:
  # Container registry host. ghcr.io = GitHub Container Registry.
  # Other common values: docker.io (implicit default), public.ecr.aws (AWS),
  # <region>-docker.pkg.dev (Google Artifact Registry).
  REGISTRY: ghcr.io

  # github.repository resolves to "owner/repo-name" automatically.
  # Used as the GHCR image path since GHCR supports nested/namespaced paths.
  IMAGE_NAME: ${{ github.repository }}

  # Docker Hub does NOT support nested paths (only "namespace/repo"), so it
  # needs its own flat name here instead of reusing IMAGE_NAME.
  DOCKERHUB_IMAGE_NAME: java-app-test-pipeline

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # ---------------------------------------------------------------------
    # PERMISSIONS
    # ---------------------------------------------------------------------
    # Scoped to the minimum this job needs (principle of least privilege).
    #   contents: read        -> allows actions/checkout to read repo code
    #   packages: write       -> allows pushing images to GHCR
    #   id-token: write       -> needed for OIDC-based auth / keyless signing
    #                            (e.g. attestations, cosign, cloud OIDC login)
    #   attestations: write   -> allows publishing build provenance
    #                            attestations (supply-chain security)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout the repo so the Dockerfile/source is available
      # ---------------------------------------------------------------
      # Options worth knowing:
      #   with: fetch-depth: 0   -> fetch full git history (needed for
      #                            tools that read git tags/log, e.g. changelogs)
      #   with: ref: <branch/tag/sha>  -> checkout something other than the
      #                            commit that triggered the workflow
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------------
      # 2. Authenticate to Docker Hub
      # ---------------------------------------------------------------
      # docker/login-action supports many registries via the "registry:"
      # input (omit it and it defaults to Docker Hub).
      # password should be a Docker Hub ACCESS TOKEN, not your real password
      # (Docker Hub -> Account Settings -> Personal access tokens).
      - name: Log in to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------------------------------------------------------------
      # 3. Authenticate to GitHub Container Registry (GHCR)
      # ---------------------------------------------------------------
      # No extra secrets needed here: GITHUB_TOKEN is auto-generated per
      # workflow run. github.actor = the user/bot that triggered the run.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------
      # 4. Compute image tags & labels automatically
      # ---------------------------------------------------------------
      # docker/metadata-action inspects the triggering event (release tag,
      # branch, PR, etc.) and generates sensible tags for you, e.g.:
      #   v1.1, latest, sha-<shortsha>
      # "images:" lists every registry path you want tags generated for —
      # one per line (as many as you like).
      #
      # Useful optional inputs you can add here for other projects:
      #   tags: |
      #     type=semver,pattern={{version}}   # custom tagging rules
      #     type=raw,value=custom-tag
      #   flavor: |
      #     latest=true    # force/disable auto "latest" tag
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            chihebellefi888515/${{ env.DOCKERHUB_IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # ---------------------------------------------------------------
      # 5. Build the Docker image and push it to both registries
      # ---------------------------------------------------------------
      # context: .        -> build using the Dockerfile in the repo root
      #                      (change to a subfolder path for monorepos)
      # push: true        -> actually push after building (set to false
      #                      for a build-only/dry-run/test step)
      # tags/labels        -> pulled straight from the metadata step above
      #
      # Other handy inputs for future projects:
      #   file: ./path/to/Dockerfile        # custom Dockerfile location
      #   platforms: linux/amd64,linux/arm64 # multi-arch builds (needs
      #                                       docker/setup-qemu-action +
      #                                       docker/setup-buildx-action)
      #   cache-from: type=gha
      #   cache-to: type=gha,mode=max        # speeds up rebuilds via
      #                                       GitHub Actions cache
      #   build-args: |
      #     MY_ARG=value                     # pass --build-arg values
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}